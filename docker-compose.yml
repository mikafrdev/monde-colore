services:
  monde-colore-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SITE: ${NEXT_PUBLIC_SITE}
        DATABASE_URL: ${DATABASE_URL}
        DIRECT_URL: ${DIRECT_URL}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    container_name: monde-colore-app
    restart: unless-stopped
    ports:
      - "3016:3000"
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    network_mode: bridge
    volumes:
      - /volume1/docker/shared-uploads:/app/media/uploads
      - /volume1/docker/shared-static:/app/media/static